spring:
  # ============================================================
  # 数据源配置（请按实际环境修改，或通过命令行参数覆盖）
  # 示例：--spring.datasource.url=jdbc:mysql://...
  # ============================================================
  datasource:
    url: jdbc:mysql://localhost:3306/jeecg-boot?characterEncoding=UTF-8&useUnicode=true&useSSL=false&tinyInt1isBit=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ============================================================
  # Flyway 配置
  # ============================================================
  flyway:
    # 是否启用 flyway（默认 false，需显式开启）
    enabled: true
    # SQL 脚本存放路径
    locations: classpath:flyway/sql/mysql
    # 是否禁用 clean（生产环境必须为 true，否则会清空数据库！）
    clean-disabled: true
    # 数据库非空时自动创建基线，避免首次运行报错
    baseline-on-migrate: true
    # 迁移时是否校验脚本内容
    validate-on-migrate: true

logging:
  level:
    org.flywaydb: info
    org.jeecg.flyway: info
